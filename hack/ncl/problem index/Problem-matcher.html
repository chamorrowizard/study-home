<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCL Problem Matcher & Knowledge Index</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#131c2e',
                            900: '#0f172a',
                            950: '#0a0d12',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0a0d12;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-cyan-500 selection:text-slate-950">

    <!-- HEADER & SEARCH BAR -->
    <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 lg:px-8 py-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <div class="flex items-center gap-3 w-full md:w-auto justify-between">
                <div class="flex items-center gap-3">
                    <div class="h-10 w-10 rounded-lg bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400">
                        <i data-lucide="terminal" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg text-slate-100 leading-tight">NCL Knowledge Index</h1>
                        <p class="text-xs text-slate-400 font-mono">CTF Problem-to-Category Matcher</p>
                    </div>
                </div>
            </div>

            <!-- Global Live Search Input -->
            <div class="relative w-full md:w-1/2 lg:w-2/5">
                <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search keywords (e.g., 'yescrypt', 'AXFR', 'auth.log', 'SUID', 'EXIF')..." 
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-10 pr-10 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all font-mono"
                >
                <button id="clearSearch" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN DASHBOARD -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-8 flex flex-col gap-6">

        <!-- Category Filter Buttons -->
        <section class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none border-b border-slate-800/60" id="filterContainer">
            <span class="text-xs font-mono text-slate-500 uppercase tracking-wider mr-2 flex items-center gap-1 shrink-0">
                <i data-lucide="filter" class="w-3 h-3"></i> Filter:
            </span>
            <button class="filter-btn active bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 px-3 py-1 rounded-full text-xs font-medium transition-all shrink-0" data-category="all">All Modules</button>
            <button class="filter-btn bg-slate-800/50 text-slate-400 border border-slate-700/50 hover:bg-slate-800 hover:text-slate-200 px-3 py-1 rounded-full text-xs font-medium transition-all shrink-0" data-category="Open Source Intelligence (OSINT)">OSINT</button>
            <button class="filter-btn bg-slate-800/50 text-slate-400 border border-slate-700/50 hover:bg-slate-800 hover:text-slate-200 px-3 py-1 rounded-full text-xs font-medium transition-all shrink-0" data-category="Cryptography">Cryptography</button>
            <button class="filter-btn bg-slate-800/50 text-slate-400 border border-slate-700/50 hover:bg-slate-800 hover:text-slate-200 px-3 py-1 rounded-full text-xs font-medium transition-all shrink-0" data-category="Password Cracking">Password Cracking</button>
            <button class="filter-btn bg-slate-800/50 text-slate-400 border border-slate-700/50 hover:bg-slate-800 hover:text-slate-200 px-3 py-1 rounded-full text-xs font-medium transition-all shrink-0" data-category="Log Analysis">Log Analysis</button>
            <button class="filter-btn bg-slate-800/50 text-slate-400 border border-slate-700/50 hover:bg-slate-800 hover:text-slate-200 px-3 py-1 rounded-full text-xs font-medium transition-all shrink-0" data-category="Network Traffic Analysis">Network Traffic</button>
            <button class="filter-btn bg-slate-800/50 text-slate-400 border border-slate-700/50 hover:bg-slate-800 hover:text-slate-200 px-3 py-1 rounded-full text-xs font-medium transition-all shrink-0" data-category="Forensics">Forensics</button>
            <button class="filter-btn bg-slate-800/50 text-slate-400 border border-slate-700/50 hover:bg-slate-800 hover:text-slate-200 px-3 py-1 rounded-full text-xs font-medium transition-all shrink-0" data-category="Scanning & Reconnaissance">Scanning & Recon</button>
            <button class="filter-btn bg-slate-800/50 text-slate-400 border border-slate-700/50 hover:bg-slate-800 hover:text-slate-200 px-3 py-1 rounded-full text-xs font-medium transition-all shrink-0" data-category="Web Application Exploitation">Web Apps</button>
            <button class="filter-btn bg-slate-800/50 text-slate-400 border border-slate-700/50 hover:bg-slate-800 hover:text-slate-200 px-3 py-1 rounded-full text-xs font-medium transition-all shrink-0" data-category="Enumeration & Exploitation">Enumeration</button>
        </section>

        <!-- Dynamic Grid -->
        <section id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards render here dynamically -->
        </section>

        <!-- Fallback -->
        <div id="noResults" class="hidden text-center py-16">
            <div class="h-12 w-12 rounded-full bg-slate-800 flex items-center justify-center text-slate-500 mx-auto mb-3">
                <i data-lucide="search-x" class="w-6 h-6"></i>
            </div>
            <h3 class="text-slate-300 font-semibold">No matching topics found</h3>
            <p class="text-slate-500 text-sm mt-1">Try keywords like "shadow", "pcap", "AXFR", "auth.log", or "SUID".</p>
        </div>

    </main>

    <footer class="border-t border-slate-800/80 bg-slate-900/50 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 lg:px-8 flex flex-col md:flex-row items-center justify-between text-xs text-slate-500 gap-4">
            <p>NCL Master Technical Field Guide & Matcher Index</p>
            <p class="font-mono">Single-File Architecture • Easily Extendable</p>
        </div>
    </footer>

    <!-- DATA & RENDER ENGINE -->
    <script>
        // Data populated directly from your NCL Field Guide dashboards
        const nclTopics = [
            {
                id: "osint",
                title: "Open Source Intelligence (OSINT)",
                icon: "globe",
                color: "text-blue-400",
                badgeBg: "bg-blue-500/10 border-blue-500/30 text-blue-300",
                link: "https://chamorrowizard.github.io/study-home/hack/ncl/OSINT/OSINT-overview.html",
                useCases: [
                    "Extract camera make/model, dimensions, exposure, or GPS DMS/decimal coordinates from JPEG/PNG headers.",
                    "Verify DNS record specifications using IETF standards (RFC 4034 DNSKEY, RFC 3596 AAAA, RFC 1035 NS).",
                    "Query domain WHOIS histories, registrars, or search threat intelligence databases for CVE details."
                ],
                indicators: ["exiftool", "GPSPosition", "CreateDate", "RFC 4034", "dig +nocmd", "WHOIS"],
                tools: ["exiftool", "dig", "Google Dorks", "Wayback Machine", "Metadata2Go"]
            },
            {
                id: "crypto",
                title: "Cryptography",
                icon: "key-round",
                color: "text-emerald-400",
                badgeBg: "bg-emerald-500/10 border-emerald-500/30 text-emerald-300",
                link: "https://chamorrowizard.github.io/study-home/hack/ncl/cryptography/cryptography-overview-gym.html",
                useCases: [
                    "Decode number base representations (Binary, Hex, Octal) or double base encodings.",
                    "Solve shift ciphers (Caesar, ROT-13), Atbash, Morse Code, Rail Fence, or Vigenère ciphers.",
                    "Perform XOR operations or break RSA cryptosystems using public exponents (e), primes (p, q), and private keys (d)."
                ],
                indicators: ["Base64 (=)", "Hex (0x)", "ROT13", "Atbash", "Rail Fence", "XOR Key", "RSA p/q/e/d"],
                tools: ["CyberChef", "dcode.fr", "Python (binascii, base64)", "rsactftool"]
            },
            {
                id: "passwords",
                title: "Password Cracking",
                icon: "lock",
                color: "text-amber-400",
                badgeBg: "bg-amber-500/10 border-amber-500/30 text-amber-300",
                link: "https://chamorrowizard.github.io/study-home/hack/ncl/password-cracking/pass-overview.html",
                useCases: [
                    "Crack Linux /etc/shadow dumps containing modern yescrypt ($y$) or SHA-512 ($6$) password hashes.",
                    "Extract shadow metadata without cracking: isolate 22-char salt, 43-char digest, or last password change date.",
                    "Execute custom mask attacks (?u?l?d?s), rule-based wordlist modifications, or hybrid dictionary attacks."
                ],
                indicators: ["$y$j9T...", "$6$", "/etc/shadow", "John the Ripper", "Hashcat mask", "rockyou.txt"],
                tools: ["John the Ripper (--format=crypt)", "Hashcat", "CyberChef", "rockyou.txt"]
            },
            {
                id: "logs",
                title: "Log Analysis",
                icon: "file-text",
                color: "text-purple-400",
                badgeBg: "bg-purple-500/10 border-purple-500/30 text-purple-300",
                link: "https://chamorrowizard.github.io/study-home/hack/ncl/Log-Analysis/Log-Analysis-overview.html",
                useCases: [
                    "Parse /var/log/auth.log to identify target hostnames, attacking IP chronologies, and successful SSH logins.",
                    "Analyze tab-delimited (TSV) login logs to calculate success/failure rates using cut -f and sort | uniq -c.",
                    "Audit VSFTPD uploads (OK UPLOAD), Nginx web traffic, Sysmon JSON logs, or Squid proxy event streams."
                ],
                indicators: ["Failed password", "Accepted publickey", "OK UPLOAD", "auth.log", "cut -f", "awk '!x[$0]++'"],
                tools: ["awk", "grep", "cut", "sort | uniq -c", "sed", "wc -l"]
            },
            {
                id: "network",
                title: "Network Traffic Analysis",
                icon: "network",
                color: "text-cyan-400",
                badgeBg: "bg-cyan-500/10 border-cyan-500/30 text-cyan-300",
                link: "https://chamorrowizard.github.io/study-home/hack/ncl/Network%20traffic%20analysis/nta-ncl-overview.html",
                useCases: [
                    "Parse DNS packet captures (.pcap) for full zone transfers (AXFR over TCP port 53) and extract TTL metadata.",
                    "Reconstruct cleartext credentials and directory file transfers from unencrypted FTP (port 21) or Telnet (port 23).",
                    "Filter HTTP headers, carve transferred payloads, or reassemble interactive shell TCP streams."
                ],
                indicators: ["dns.flags.response", "AXFR", "ftp.response.code == 230", "tcp.port == 23", "dns.resp.ttl"],
                tools: ["Wireshark", "tshark", "NetworkMiner", "tcpdump"]
            },
            {
                id: "forensics",
                title: "Forensics",
                icon: "archive",
                color: "text-rose-400",
                badgeBg: "bg-rose-500/10 border-rose-500/30 text-rose-300",
                link: "https://chamorrowizard.github.io/study-home/hack/ncl/Forensics/forensics-reference.html",
                useCases: [
                    "Triage raw live system memory dumps (.mem, .raw, .vmem) with Volatility3 to extract OS info and envars.",
                    "Scan memory virtual addresses to dump cached files, active process handles, or registry hives.",
                    "Inspect Git version control commit histories or carve hidden file artifacts from raw disk images."
                ],
                indicators: ["Volatility3", "windows.info", "windows.envars", "COMPUTERNAME", "SleuthKit", "Git commits"],
                tools: ["Volatility3", "Autopsy", "FTK Imager", "sleuthkit", "strings", "git log"]
            },
            {
                id: "recon",
                title: "Scanning & Reconnaissance",
                icon: "radar",
                color: "text-indigo-400",
                badgeBg: "bg-indigo-500/10 border-indigo-500/30 text-indigo-300",
                link: "https://chamorrowizard.github.io/study-home/hack/ncl/Scanning%20and%20Reconnaissance/sr-overview.html",
                useCases: [
                    "Query specific DNS record types (A, MX, NS, TXT, RP) against target resolvers using dig @resolver.",
                    "Execute Nmap stealth scans (-Pn -sV) to discover active ports, bypass ICMP filters, and identify software versions.",
                    "Audit MX record priority numbers or extract obfuscated flags hidden inside DNS TXT records."
                ],
                indicators: ["dig @resolver", "MX priority", "TXT record", "nmap -Pn -sV", "port discovery"],
                tools: ["nmap", "dig", "masscan", "git-dumper"]
            },
            {
                id: "webapps",
                title: "Web Application Exploitation",
                icon: "layout-template",
                color: "text-orange-400",
                badgeBg: "bg-orange-500/10 border-orange-500/30 text-orange-300",
                link: "https://chamorrowizard.github.io/study-home/hack/ncl/Web%20Apps/web-app-exploit-overview.html",
                useCases: [
                    "Exploit SQL Injection (SQLi) using UNION SELECT to dump SQLite schema tables (sqlite_master) or run sqlmap.",
                    "Inject Reflected/Stored XSS payloads to steal session cookies via fetch() or bypass forms.",
                    "Coerce Server-Side Request Forgery (SSRF) to query internal endpoints or cloud metadata (IMDS 169.254.169.254)."
                ],
                indicators: ["UNION SELECT", "sqlite_master", "<script>fetch()", "HttpOnly", "169.254.169.254", "LFI"],
                tools: ["Burp Suite", "sqlmap", "CyberChef", "Browser DevTools"]
            },
            {
                id: "enumeration",
                title: "Enumeration & Exploitation",
                icon: "terminal-square",
                color: "text-teal-400",
                badgeBg: "bg-teal-500/10 border-teal-500/30 text-teal-300",
                link: "https://chamorrowizard.github.io/study-home/hack/ncl/Enumeration%20and%20Exploitation/enumerate-overview.html",
                useCases: [
                    "Audit Linux filesystem permissions, executable bit configurations, and SUID/SGID binaries (find -perm -4000).",
                    "Inspect compiled ELF headers, symbol tables, and dynamic link libraries using readelf and objdump.",
                    "Review Linux system access control lists and binary capabilities without external tools."
                ],
                indicators: ["find -perm -4000", "SUID / SGID", "readelf -h", "objdump -t", "2>/dev/null"],
                tools: ["find", "readelf", "objdump", "ls -la", "gdb"]
            }
        ];

        // UI Engine
        const cardsGrid = document.getElementById('cardsGrid');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');
        const noResults = document.getElementById('noResults');
        const filterBtns = document.querySelectorAll('.filter-btn');

        let activeCategory = 'all';

        function renderCards(filterQuery = '', category = 'all') {
            cardsGrid.innerHTML = '';
            const query = filterQuery.toLowerCase().trim();
            let matchesCount = 0;

            nclTopics.forEach(topic => {
                const matchesCategory = category === 'all' || topic.title === category;

                const searchableText = `
                    ${topic.title} 
                    ${topic.useCases.join(' ')} 
                    ${topic.indicators.join(' ')} 
                    ${topic.tools.join(' ')}
                `.toLowerCase();

                const matchesSearch = query === '' || searchableText.includes(query);

                if (matchesCategory && matchesSearch) {
                    matchesCount++;

                    const card = document.createElement('div');
                    card.className = "bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col justify-between hover:border-slate-700 transition-all duration-200 group";

                    card.innerHTML = `
                        <div>
                            <div class="flex items-start justify-between gap-3 mb-4">
                                <div class="flex items-center gap-3">
                                    <div class="p-2.5 rounded-lg bg-slate-950 border border-slate-800 ${topic.color}">
                                        <i data-lucide="${topic.icon}" class="w-5 h-5"></i>
                                    </div>
                                    <h2 class="font-semibold text-slate-100 text-sm group-hover:text-cyan-400 transition-colors">${topic.title}</h2>
                                </div>
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-mono border ${topic.badgeBg} whitespace-nowrap">
                                    Active
                                </span>
                            </div>

                            <div class="mb-4">
                                <h3 class="text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-2 flex items-center gap-1">
                                    <i data-lucide="help-circle" class="w-3 h-3 text-cyan-400"></i> Match Your Problem If:
                                </h3>
                                <ul class="space-y-1.5 text-xs text-slate-300">
                                    ${topic.useCases.map(uc => `
                                        <li class="flex items-start gap-2 bg-slate-950/60 p-2 rounded border border-slate-800/40">
                                            <span class="text-cyan-400 mt-0.5">•</span>
                                            <span class="leading-relaxed">${uc}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>

                            <div class="mb-4">
                                <h3 class="text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-2 flex items-center gap-1">
                                    <i data-lucide="zap" class="w-3 h-3 text-amber-400"></i> Indicators / Commands:
                                </h3>
                                <div class="flex flex-wrap gap-1.5">
                                    ${topic.indicators.map(ind => `
                                        <span class="px-2 py-0.5 rounded bg-slate-950 border border-slate-800 text-[11px] font-mono text-slate-400">${ind}</span>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <div class="pt-3 border-t border-slate-800 flex items-center justify-between mt-auto">
                            <span class="text-[11px] font-mono text-slate-500">Tools: ${topic.tools.slice(0, 3).join(', ')}</span>
                            <a href="${topic.link}" target="_blank" class="inline-flex items-center gap-1.5 text-xs font-semibold text-cyan-400 hover:text-cyan-300 group/link">
                                Open Field Guide <i data-lucide="arrow-right" class="w-3.5 h-3.5 group-hover/link:translate-x-0.5 transition-transform"></i>
                            </a>
                        </div>
                    `;

                    cardsGrid.appendChild(card);
                }
            });

            lucide.createIcons();

            if (matchesCount === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
            }
        }

        // Event Listeners
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value;
            clearSearchBtn.classList.toggle('hidden', val.length === 0);
            renderCards(val, activeCategory);
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            renderCards('', activeCategory);
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('active', 'bg-cyan-500/20', 'text-cyan-300', 'border-cyan-500/40');
                    b.classList.add('bg-slate-800/50', 'text-slate-400', 'border-slate-700/50');
                });

                btn.classList.add('active', 'bg-cyan-500/20', 'text-cyan-300', 'border-cyan-500/40');
                btn.classList.remove('bg-slate-800/50', 'text-slate-400', 'border-slate-700/50');

                activeCategory = btn.getAttribute('data-category');
                renderCards(searchInput.value, activeCategory);
            });
        });

        // Initialize Page
        renderCards();
    </script>
</body>
</html>

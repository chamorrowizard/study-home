                    { code: "    heavy_sha256_hash_computation(&data)", note: "Executes directly on async worker thread." },
                    { code: "}", note: "" },
                    { code: "", note: "" },
                    { code: "// ✅ AFTER: Offloading heavy computation via spawn_blocking", note: "Delegates computation to dedicated blocking thread pool." },
                    { code: "use tokio::task;", note: "Tokio task management API." },
                    { code: "", note: "" },
                    { code: "pub async fn process_data_after(data: Vec<u8>) -> Vec<u8> {", note: "Non-blocking async path." },
                    { code: "    // ✨ Offloads compute to blocking pool, keeping async loop free!", note: "Frees async worker thread immediately." },
                    { code: "    task::spawn_blocking(move || {", note: "Spawns closure on dedicated thread." },
                    { code: "        heavy_sha256_hash_computation(&data)", note: "Executes safely off the async path." },
                    { code: "    }).await.unwrap()", note: "Awaits result asynchronously." },
                    { code: "}", note: "" }
                ]
            },
            {
                id: 22,
                category: "Compiler Optimization",
                title: "Lesson 22: Profile-Guided Optimization (PGO)",
                fileName: "Cargo.toml",
                description: "Use real-world execution profile data to let LLVM auto-tune code branch layouts and inlining.",
                takeaways: [
                    "<b>Before:</b> Standard <code>cargo build --release</code> optimizes cold and hot branches equally using general heuristics.",
                    "<b>After:</b> <code>cargo-pgo</code> records runtime execution metrics, enabling LLVM to optimize the exact code paths your users execute most.",
                    "Delivers 10%–30% performance gains across complex binaries without modifying source code."
                ],
                lines: [
                    { code: "# ❌ BEFORE: Standard release build flags", note: "Uses static compiler heuristics." },
                    { code: "# cargo build --release", note: "Standard build command." },
                    { code: "", note: "" },
                    { code: "# ✅ AFTER: 3-step PGO Compilation Workflow", note: "Instruments binary and optimizes using actual runtime telemetry." },
                    { code: "# 1. Build instrumented binary:", note: "Step 1: Inject profiling counters." },
                    { code: "# RUSTFLAGS=\"-Cprofile-generate=./pgo-data\" cargo build --release", note: "Compiles binary with profile generation enabled." },
                    { code: "", note: "" },
                    { code: "# 2. Run binary with realistic production benchmark workload:", note: "Step 2: Collect runtime profile data." },
                    { code: "# ./target/release/my_app --run-benchmarks", note: "Generates .profraw telemetry files on disk." },
                    { code: "", note: "" },
                    { code: "# 3. Merge profile data and compile finalized hyper-optimized binary:", note: "Step 3: Feed profile into LLVM optimizer." },
                    { code: "# llvm-profdata merge -o ./pgo-data/merged.profdata ./pgo-data/*.profraw", note: "Merges telemetry." },
                    { code: "# RUSTFLAGS=\"-Cprofile-use=./pgo-data/merged.profdata\" cargo build --release", note: "✨ Generates optimized binary tuned for actual hardware usage!" }
                ]
            },
            {
                id: 23,
                category: "Memory Allocator",
                title: "Lesson 23: Global Memory Allocator Swapping (jemalloc/mimalloc)",
                fileName: "src/main.rs",
                description: "Replace the default OS heap allocator with a high-performance multi-threaded allocator.",
                takeaways: [
                    "<b>Before:</b> Standard system allocator (glibc malloc / Windows Heap) can lock thread mutexes during frequent allocations.",
                    "<b>After:</b> <code>tikv-jemallocator</code> or <code>mimalloc</code> uses thread-local arenas to eliminate global heap contention.",
                    "Dramatically improves memory throughput in highly concurrent multi-threaded services."
                ],
                lines: [
                    { code: "// ❌ BEFORE: Using standard OS system heap allocator", note: "Uses default glibc/MSVC heap allocator." },
                    { code: "fn main() {", note: "Default entry point." },
                    { code: "    // Standard allocation behavior...", note: "Allocations acquire global system locks." },
                    { code: "}", note: "" },
                    { code: "", note: "" },
                    { code: "// ✅ AFTER: Registering jemalloc as global allocator", note: "Replaces system allocator globally." },
                    { code: "#[cfg(not(target_env = \"msvc\"))]", note: "Executes on non-MSVC target platforms." },
                    { code: "use tikv_jemallocator::Jemalloc;", note: "Imports thread-arena optimized heap allocator." },
                    { code: "", note: "" },
                    { code: "#[cfg(not(target_env = \"msvc\"))]", note: "Applies attribute globally." },
                    { code: "#[global_allocator]", note: "Instructs Rust compiler to replace dynamic allocator." },
                    { code: "static GLOBAL: Jemalloc = Jemalloc; // ✨ Instant 10-20% allocation throughput boost!", note: "Uses thread-local allocation arenas without dynamic system locks." },
                    { code: "", note: "" },
                    { code: "fn main() {", note: "Optimized runtime application entry." },
                    { code: "    // All heap operations now use ultra-fast jemalloc arenas", note: "Zero extra code needed in business logic." },
                    { code: "}", note: "" }
                ]
            }
        ];

        let currentLessonIdx = 0;

        document.addEventListener('DOMContentLoaded', () => {
            renderLessonTabs();
            loadLesson(0);
            lucide.createIcons();
        });

        function renderLessonTabs() {
            const container = document.getElementById('lesson-tabs');
            container.innerHTML = LESSONS.map((l, idx) => `
                <button onclick="loadLesson(${idx})" 
                        id="tab-${idx}"
                        class="whitespace-nowrap sm:w-full text-left px-3.5 py-2.5 rounded-xl border text-xs font-semibold transition flex items-center justify-between gap-2 border-white/5 bg-white/5 hover:bg-white/10 text-gray-300">
                    <div class="flex items-center space-x-2">
                        <span class="w-5 h-5 rounded-md bg-rust-500/20 text-rust-500 flex items-center justify-center font-mono text-[10px]">${l.id}</span>
                        <span class="truncate">${l.title.split(':')[1] || l.title}</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-3.5 h-3.5 hidden lg:block opacity-40"></i>
                </button>
            `).join('');
        }

        function loadLesson(index) {
            currentLessonIdx = index;
            const lesson = LESSONS[index];

            document.getElementById('lesson-progress-badge').innerText = `Lesson ${lesson.id} of ${LESSONS.length}`;
            document.getElementById('current-category').innerText = lesson.category;
            document.getElementById('current-title').innerText = lesson.title;
            document.getElementById('current-description').innerText = lesson.description;
            document.getElementById('file-name').innerText = lesson.fileName;

            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').disabled = index === LESSONS.length - 1;

            LESSONS.forEach((_, i) => {
                const tab = document.getElementById(`tab-${i}`);
                if (i === index) {
                    tab.className = "whitespace-nowrap sm:w-full text-left px-3.5 py-2.5 rounded-xl border text-xs font-semibold transition flex items-center justify-between gap-2 border-rust-500/50 bg-rust-500/20 text-white shadow-lg shadow-rust-500/10";
                } else {
                    tab.className = "whitespace-nowrap sm:w-full text-left px-3.5 py-2.5 rounded-xl border text-xs font-semibold transition flex items-center justify-between gap-2 border-white/5 bg-white/5 hover:bg-white/10 text-gray-300";
                }
            });

            // Render Code Rows (Line Numbers Outside Code Block)
            const codeContainer = document.getElementById('code-container');
            codeContainer.innerHTML = lesson.lines.map((item, idx) => {
                const lineNum = idx + 1;
                const escaped = item.code
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");

                return `
                    <div class="line-row" id="row-${idx}" onclick="selectLine(${idx})">
                        <div class="line-number">${lineNum}</div>
                        <div class="line-code"><pre class="language-rust"><code>${escaped || ' '}</code></pre></div>
                    </div>
                `;
            }).join('');

            // Highlight syntax
            document.querySelectorAll('#code-container pre code').forEach((el) => {
                Prism.highlightElement(el);
            });

            // Render Takeaways
            document.getElementById('takeaway-list').innerHTML = lesson.takeaways.map(t => `
                <li class="flex items-start space-x-2">
                    <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400 shrink-0 mt-0.5"></i>
                    <span>${t}</span>
                </li>
            `).join('');

            selectLine(0);
            lucide.createIcons();
        }

        function selectLine(lineIdx) {
            const lesson = LESSONS[currentLessonIdx];
            const lineData = lesson.lines[lineIdx];

            document.querySelectorAll('.line-row').forEach((el, idx) => {
                if (idx === lineIdx) {
                    el.classList.add('active-line');
                } else {
                    el.classList.remove('active-line');
                }
            });

            const educatorBox = document.getElementById('educator-explanation');
            if (lineData && lineData.note) {
                educatorBox.innerHTML = `
                    <div class="p-2.5 rounded-xl bg-white/5 border border-white/10 font-mono text-xs text-rust-400 mb-2">
                        Line ${lineIdx + 1}: ${lineData.code || '(empty line)'}
                    </div>
                    <p>${lineData.note}</p>
                `;
            } else {
                educatorBox.innerHTML = `
                    <p class="text-gray-400 italic">Click on any line of Rust code above to see an in-depth breakdown from your educator!</p>
                `;
            }
        }

        function prevLesson() {
            if (currentLessonIdx > 0) loadLesson(currentLessonIdx - 1);
        }

        function nextLesson() {
            if (currentLessonIdx < LESSONS.length - 1) loadLesson(currentLessonIdx + 1);
        }

        function copyCurrentCode() {
            const rawCode = LESSONS[currentLessonIdx].lines.map(l => l.code).join('\n');
            navigator.clipboard.writeText(rawCode).then(() => {
                const btnText = document.getElementById('copy-btn-text');
                btnText.innerText = 'Copied!';
                setTimeout(() => btnText.innerText = 'Copy Code', 2000);
            });
        }
    </script>
</body>
